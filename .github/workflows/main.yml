name: Atualizar Catalogo

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Capturar 100 produtos e enviar Supabase
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          import re
          import json

          SUPABASE_URL = "https://kcydlzerrhezpcxkqonx.supabase.co/rest/v1/produtos"
          SUPABASE_KEY = "sb_publishable_49LGouu90RYiPtXoTh8-rg_yOWJd46d"

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
          }

          url = "https://catalogo.innosystem.com.br/atacadoaj_g2"

          html = requests.get(url, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          produtos = []
          usados = set()

          textos = soup.get_text("\n", strip=True).split("\n")

          for linha in textos:
              t = linha.strip()

              if "r$" in t.lower() and "cód." in t.lower():
                  if t in usados:
                      continue

                  usados.add(t)

                  nome = t.split("r$")[0].strip()

                  preco_match = re.search(r'r\$ ?([\d\,]+)', t.lower())
                  cod_match = re.search(r'cód\. ?(\d+)', t.lower())

                  preco = None
                  codigo = ""

                  if preco_match:
                      preco = float(preco_match.group(1).replace(",", "."))

                  if cod_match:
                      codigo = cod_match.group(1)

                  produtos.append({
                      "nome": nome[:200],
                      "codigo": codigo,
                      "categoria": "Catalogo Geral",
                      "preco_custo": preco,
                      "preco_venda": round(preco * 2, 2) if preco else None,
                      "imagem_url": "",
                      "produto_url": "",
                      "ativo": True
                  })

              if len(produtos) >= 100:
                  break

          print("PRODUTOS ENCONTRADOS:", len(produtos))

          if produtos:
              r = requests.post(SUPABASE_URL, headers=headers, data=json.dumps(produtos))
              print("SUPABASE STATUS:", r.status_code)
              print(r.text)

          EOF
