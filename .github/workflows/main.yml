import requests,re,json,time
from bs4 import BeautifulSoup

SUPABASE_URL = "https://kcydlzerrhezpcxkqonx.supabase.co"
SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"

headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type":"application/json"
}

base = "https://catalogo.innosystem.com.br/atacadoaj_g2"

enviados = 0

for pagina in range(1,19):

    url = f"{base}?pagina={pagina}"

    print("LENDO:", url)

    html = requests.get(url,timeout=30).text
    soup = BeautifulSoup(html,"html.parser")

    cards = soup.select("div.margem")

    print("Produtos página:", len(cards))

    for card in cards:

        nome = ""
        preco = 0
        categoria = ""
        codigo = ""
        imagem = ""

        n = card.select_one(".tnom")
        if n:
            nome = n.get_text(" ",strip=True)

        p = card.select_one(".tprc")
        if p:
            txt = p.get_text(" ",strip=True)
            txt = re.sub(r'[^0-9,\.]', '', txt)
            txt = txt.replace('.','').replace(',','.')
            try:
                preco = float(txt)
            except:
                preco = 0

        c = card.select_one(".tcat")
        if c:
            categoria = c.get_text(" ",strip=True)

        m = re.search(r'c[oó]d\.?\s*(\d+)', card.get_text(" ",strip=True).lower())
        if m:
            codigo = m.group(1)

        img = card.select_one("img")
        if img:
            imagem = img.get("src","")
            if imagem.startswith("/"):
                imagem = "https://catalogo.innosystem.com.br" + imagem

        if nome == "":
            continue

        payload = {
            "nome": nome,
            "codigo": codigo,
            "categoria": categoria,
            "preco_custo": preco,
            "preco_venda": round(preco * 2.2,2),
            "imagem_url": imagem,
            "produto_url": url,
            "ativo": True
        }

        r = requests.post(
            SUPABASE_URL + "/rest/v1/produtos",
            headers=headers,
            data=json.dumps(payload),
            timeout=30
        )

        print(nome[:50], r.status_code)

        if r.status_code in [200,201]:
            enviados += 1

    time.sleep(1)

print("TOTAL:", enviados)
