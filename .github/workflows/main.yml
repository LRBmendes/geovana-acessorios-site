name: Atualizar Catalogo

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4

      - name: Extrair Produtos Reais
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          import re

          session = requests.Session()
          url = "https://catalogo.innosystem.com.br/atacadoaj_g2"

          html = session.get(url).text
          soup = BeautifulSoup(html,"html.parser")

          alvo=None

          for a in soup.find_all("a"):
              txt=a.get_text(" ",strip=True).lower()
              if "brincos" in txt and "semijoia" in txt:
                  alvo=a.get("href")
                  break

          m=re.search(r"__doPostBack\('([^']+)',''\)",alvo)
          target=m.group(1)

          form={}
          for i in soup.find_all("input"):
              n=i.get("name")
              v=i.get("value","")
              if n:
                  form[n]=v

          form["__EVENTTARGET"]=target
          form["__EVENTARGUMENT"]=""

          r=session.post(url,data=form)

          html2=r.text
          linhas=html2.splitlines()

          for i,l in enumerate(linhas[:600]):
              if "produto.jpg" in l.lower():
                  print("----- BLOCO -----")
                  for x in linhas[i:i+20]:
                      print(x.strip())
          EOF
