name: Atualizar Catalogo

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Capturar 100 produtos reais
        env:
          SUPABASE_URL: https://kcydlzerrhezpcxkqonx.supabase.co
          SUPABASE_KEY: sb_publishable_49LGouu90RYiPtXoTh8-rg_yOWJd46d
        run: |
          python <<EOF
          import requests
          import re
          import json
          import os
          from bs4 import BeautifulSoup

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          url = "https://catalogo.innosystem.com.br/atacadoaj_g2"

          html = requests.get(url, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          cards = soup.select("div.margem")

          print("CARDS ENCONTRADOS:", len(cards))

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
          }

          enviados = 0

          for card in cards[:100]:
              nome = ""
              preco = 0
              categoria = ""
              codigo = ""
              imagem = ""

              n = card.select_one(".tnom")
              if n:
                  nome = n.get_text(" ", strip=True)

              p = card.select_one(".tprc")
              if p:
                  txt = p.get_text(" ", strip=True)
                  txt = re.sub(r'[^0-9,\.]', '', txt)
                  txt = txt.replace('.', '').replace(',', '.')
                  try:
                      preco = float(txt)
                  except:
                      preco = 0

              c = card.select_one(".tcat")
              if c:
                  categoria = c.get_text(" ", strip=True)

                  m = re.search(r'c[oó]d\.?\s*(\d+)', categoria.lower())
                  if m:
                      codigo = m.group(1)

              img = card.select_one("img")
              if img:
                  imagem = img.get("src", "")
                  if imagem.startswith("/"):
                      imagem = "https://catalogo.innosystem.com.br" + imagem

              if not nome:
                  continue

              payload = {
                  "nome": nome,
                  "codigo": codigo,
                  "categoria": categoria,
                  "preco_custo": preco,
                  "preco_venda": round(preco * 2.2, 2),
                  "imagem_url": imagem,
                  "produto_url": url,
                  "ativo": True
              }

              r = requests.post(
                  SUPABASE_URL + "/rest/v1/produtos",
                  headers=headers,
                  data=json.dumps(payload),
                  timeout=30
              )

              print(nome[:60], "->", r.status_code)

              if r.status_code in [200, 201]:
                  enviados += 1

          print("TOTAL ENVIADOS:", enviados)
          EOF
