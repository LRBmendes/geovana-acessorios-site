name: Atualizar Catalogo

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4

      - name: Capturar Brincos Semijoia
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          import re

          session = requests.Session()
          url = "https://catalogo.innosystem.com.br/atacadoaj_g2"

          print("ABRINDO SITE...")
          html = session.get(url, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          alvo = None

          for a in soup.find_all("a"):
              txt = a.get_text(" ", strip=True).lower()
              href = a.get("href", "")

              if "brincos" in txt and "semijoia" in txt:
                  alvo = href
                  print("LINK ACHADO:", txt)
                  break

          if not alvo:
              print("LINK NÃO ENCONTRADO")
              exit()

          m = re.search(r"__doPostBack\('([^']+)',''\)", alvo)

          if not m:
              print("POSTBACK NÃO IDENTIFICADO")
              exit()

          target = m.group(1)

          form = {}

          for inp in soup.find_all("input"):
              name = inp.get("name")
              value = inp.get("value", "")
              if name:
                  form[name] = value

          form["__EVENTTARGET"] = target
          form["__EVENTARGUMENT"] = ""

          resposta = session.post(url, data=form, timeout=30)

          print("STATUS:", resposta.status_code)

          soup2 = BeautifulSoup(resposta.text, "html.parser")
          linhas = soup2.get_text("\n", strip=True).split("\n")

          total = 0

          for linha in linhas:
              t = linha.strip()

              if "r$" in t.lower() and "cód." in t.lower():
                  print(t)
                  total += 1

          print("TOTAL PRODUTOS:", total)
          print("FIM")
          EOF
