name: Atualizar Catalogo

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Testar Brincos Semijoia
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          import re

          session = requests.Session()
          url = "https://catalogo.innosystem.com.br/atacadoaj_g2"

          html = session.get(url, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          alvo = None

          for a in soup.find_all("a"):
              texto = a.get_text(" ", strip=True).lower()
              href = a.get("href","")

              if "brincos" in texto and "semijoia" in texto:
                  alvo = href
                  print("ACHOU:", texto)
                  break

          if not alvo:
              print("LINK NÃO ENCONTRADO")
              exit()

          m = re.search(r"__doPostBack\('([^']+)',''\)", alvo)

          if not m:
              print("POSTBACK INVÁLIDO")
              exit()

          target = m.group(1)

          form = {}

          for inp in soup.find_all("input"):
              name = inp.get("name")
              value = inp.get("value","")
              if name:
                  form[name] = value

          form["__EVENTTARGET"] = target
          form["__EVENTARGUMENT"] = ""

          r = session.post(url, data=form, timeout=30)

          print("STATUS:", r.status_code)

          soup2 = BeautifulSoup(r.text, "html.parser")

          textos = soup2.get_text("\n", strip=True).split("\n")

          encontrados = 0

          for t in textos:
              t = t.strip()

              if len(t) > 4:
                  print(t[:150])
                  encontrados += 1

              if encontrados >= 120:
                  break

          print("FIM")
          EOF
